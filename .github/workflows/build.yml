name: Build image

# Only version tags build (and publish a release); branch pushes and pull
# requests do not. "Run workflow" builds any ref and only keeps an artifact.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # create the release

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Buildroot host packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc cpio file rsync unzip wget libssl-dev

      - name: Cache downloads
        uses: actions/cache@v6
        with:
          path: dl
          key: dl-${{ hashFiles('external/configs/*', 'external/package/**/*.hash', '.gitmodules') }}
          restore-keys: dl-

      - name: Build
        run: make

      - name: Package image
        id: package
        run: |
          name="mobix-${GITHUB_REF_NAME//\//-}.img"
          mkdir dist
          cp output/images/sdcard.img "dist/$name"
          xz -T0 "dist/$name"
          (cd dist && sha256sum "$name.xz" > "$name.xz.sha256")
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.name }}
          path: dist/

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes
