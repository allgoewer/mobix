name: Build check

# Verifies that a version tag builds from a clean checkout. It does not
# publish anything: releases are built and signed locally ("make
# release"), because the signing key must never be available to CI.
# "Run workflow" checks any ref.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Buildroot host packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc cpio file rsync unzip wget libssl-dev

      - name: Cache downloads
        uses: actions/cache@v6
        with:
          path: dl
          key: dl-${{ hashFiles('external/configs/*', 'external/package/**/*.hash', '.gitmodules') }}
          restore-keys: dl-

      - name: Build
        run: make
