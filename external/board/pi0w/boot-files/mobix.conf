# mobix configuration (shell syntax, read at boot and by the app via $MOBIX_CONFIG)

HOSTNAME=mobix

NTP_SERVER=pool.ntp.org

# MQTT broker for print jobs; the app stays idle while MQTT_HOST is empty.
# It subscribes to <prefix>/print and keeps <prefix>/status online/offline.
MQTT_HOST=
#MQTT_PORT=1883              # default 1883, 8883 with TLS
#MQTT_USER=
#MQTT_PASSWORD=
#MQTT_TLS=1                  # verify against the system CAs ...
#MQTT_CA=/boot/mqtt-ca.pem   # ... or against this CA (PEM)
#MQTT_TOPIC_PREFIX=mobix/mobix   # default mobix/<HOSTNAME>

#PRINTER_URI=ipp://localhost:8000/ipp/print
#PRINT_PPI=203               # default: the printer's resolution
