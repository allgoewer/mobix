# Wi-Fi configuration, copied to /etc/wpa_supplicant.conf at boot.
# Edit this file on the SD card's FAT partition.
ctrl_interface=/var/run/wpa_supplicant
update_config=0

# Regulatory domain: set to your country, avoids a re-scan after association
country=DE

# Scan and reconnect behaviour
ap_scan=1
# While disconnected, rescan after 2 s, backing off to every 30 s
autoscan=exponential:2:30

network={
	ssid="YourSSID"
	psk="YourPassphrase"
	key_mgmt=WPA-PSK
	# Optional: restrict scanning to the AP's channel for a faster connect,
	# e.g. channel 6 = 2437 MHz
	#scan_freq=2437
	#freq_list=2437
	priority=10
}

# More networks can be added; the highest priority in range wins.
#network={
#	ssid="Backup"
#	psk="..."
#	priority=5
#}
