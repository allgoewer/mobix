# dhcpcd config tuned for a fast first lease after boot.

hostname
# Stable DHCPv6 DUID from the MAC: the default one carries a timestamp and
# would be regenerated on every boot (/var/db is RAM). Must come before
# clientid, which keeps the DHCPv4 client ID at the hardware address.
duid ll
clientid
option rapid_commit
option domain_name_servers, domain_name, domain_search, host_name
option classless_static_routes
option interface_mtu
require dhcp_server_identifier

# Stable SLAAC address from the MAC: "private" needs a secret that would
# not survive a reboot either
slaac hwaddr

# Fast path: no random start delay, no ARP collision probe
nodelay
noarp
noipv4ll
