image boot.vfat {
	vfat {
		label = "MOBIX"
		files = {
			"rpi-firmware/bootcode.bin",
			"rpi-firmware/start_cd.elf",
			"rpi-firmware/fixup_cd.dat",
			"rpi-firmware/config.txt",
			"rpi-firmware/cmdline.txt",
			"rpi-firmware/overlays",
			"bcm2708-rpi-zero-w.dtb",
			"zImage",
			"rootfs.cpio.lz4",
			"boot-files/wpa_supplicant.conf",
			"boot-files/mobix.conf",
		}
	}

	size = 64M
}

image sdcard.img {
	hdimage {
	}

	partition boot {
		partition-type = 0xC
		bootable = "true"
		image = "boot.vfat"
	}
}
